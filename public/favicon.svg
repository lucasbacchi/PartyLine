<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="partyline-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#partyline-grad)" />

  <!-- Subtle inner border highlight -->
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="white" stroke-width="3"
    stroke-opacity="0.25" />

  <!-- PartyLine Brand 'P' -->
  <text
    x="128"
    y="122"
    text-anchor="middle"
    dominant-baseline="central"
    fill="white"
    filter="url(#shadow)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Arial, sans-serif"
    font-weight="900"
    font-size="160"
    letter-spacing="-2"
  >P</text>
</svg>